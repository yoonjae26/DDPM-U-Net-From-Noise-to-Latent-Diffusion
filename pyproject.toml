[project]
name = "latent-diffusion-playground"
version = "0.1.0"
description = "Interactive latent diffusion playground with VAE, DDPM, and U-Net phases"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pillow>=10.0.0",
    "pyarrow>=16.0.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "matplotlib>=3.9.0",
]
webui = [
    "gradio>=4.44.0",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/latent_diffusion_playground"]

[tool.uv]
package = true
